[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meu-passeio"
version = "0.1.0"
description = "Meu Passeio — MCP Servers de viagem (lugares, mapas, clima e orçamento) e uma API FastAPI que os conecta via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
meu-passeio-api = "meu_passeio.api.main:run"
meu-passeio-mcp = "meu_passeio.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meu_passeio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["ASYNC109"]  # timeouts explícitos por chamada são intencionais
