# Configuração dos MCP Servers conectados pelo MCP Client Manager da API.
#
# - transport: por enquanto "stdio" (o server é um processo filho).
# - command: "{python}" é substituído pelo interpretador Python atual (o da venv).
# - env: variáveis extras repassadas ao processo. Use ${VAR} para ler do ambiente do host;
#   segredos ficam no ambiente/secret manager, nunca neste arquivo.
# - allowed_tools: allowlist opcional; se omitido, todas as tools descobertas são permitidas.
# - timeout_seconds / retries: limites por chamada de tool.

mcpServers:
  meu-passeio:
    transport: stdio
    command: "{python}"
    args: ["-m", "meu_passeio.mcp_server"]
    enabled: true
    # A busca de lugares pode esperar o failover entre instâncias do Overpass.
    timeout_seconds: 90
    retries: 0
